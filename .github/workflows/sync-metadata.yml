name: Sync vyges-ip metadata

on:
  schedule:
    # Every 6 hours, on the hour
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/sync_metadata.py'
      - 'scripts/score_all.py'
      - '.github/workflows/sync-metadata.yml'

permissions:
  contents: write

# Serialised with every other workflow that pushes to main (sync-metadata,
# metadata-schema-drift, metadata-reconcile-drift). Per-workflow groups let two
# of them run at once and race on `git push`; the loser is rejected
# non-fast-forward. The cron times are offset, but `paths:` triggers are not --
# one commit touching two workflow files fires both at once, which is exactly
# how run 31024152015 failed. One shared group is what actually prevents it.
concurrency:
  group: catalog-main-push
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout registry repo
        uses: actions/checkout@v7
        # Full history: the push below rebases, and a depth-1 clone has no
        # merge base to rebase onto.
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Crawl vyges-ip + write metadata
        env:
          GITHUB_TOKEN: ${{ secrets.VYGES_IP_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_metadata.py --org vyges-ip --output . --prune

      - name: Score every IP via vyges/metadata-scorer-action
        run: |
          python scripts/score_all.py --metadata-dir metadata --output . \
                                      --scorer-ref v1

      - name: Commit changes (if any)
        run: |
          git config user.name  'vyges-ip-catalog-bot'
          git config user.email 'noreply@vyges.com'
          TRACKED="metadata index.json SUMMARY.md scores.json SCORES.md"
          if [[ -n "$(git status --porcelain $TRACKED)" ]]; then
            git add $TRACKED
            git commit -m "sync: refresh metadata + scores $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # The run checks out the SHA that TRIGGERED it, not the tip of main.
            # If another workflow pushed while this one queued, the local branch is
            # stale and the push is rejected non-fast-forward. Rebase closes that;
            # the shared concurrency group stops the two from interleaving.
            git pull --rebase --autostash origin main
            git push
          else
            echo 'No changes — skipping commit.'
          fi
